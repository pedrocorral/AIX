# AIX manifest. Tools and scripts read this; agents rarely need to.
name: aix
version: 2.18.1
spec: https://agentskills.io   # skills follow the Agent Skills open format (SKILL.md + YAML front-matter)
entrypoint: AGENTS.md
paths:                    # where things live in a project (2.0 layout); the code tools search code_roots by default
  docs: docs
  requirements: docs/requirements
  tests: docs/tests
  security: docs/security
  roadmap: docs/road-map
  conflicts: docs/conflicts
  operations: docs/operations
  kit: .aix
  meta_docs: .aix/meta-docs
  skills: .aix/skills
  templates: .aix/templates
  custom: .aix/custom       # this project's overrides (committed); person: ~/.config/aix ; organisation: .aix/org
  code_roots: [backend, frontend, shared, infra, src, app, tests, lib]   # those that exist; none -> the whole project
# agents: [claude, copilot]   # the agents this project equips (claude, copilot, cursor, gemini, opencode, codex); set by `aix agents`; no line = all
id_prefixes:
  requirement_functional: FR
  requirement_non_functional: NFR
  api: API
  data_model: DM
  decision: ADR
  test_spec: TS
  vulnerability: VUL
  task: TASK
  conflict: CONFLICT
code_markers:
  implements: "@implements"
  tests: "@tests"
  mitigates: "@mitigates"
disabled_skills: []   # managed by `aix skills enable|disable`
style:                    # aix code style limits (per function unless noted); sources in docs/meta-docs/conventions/readability.md
  max_lines: 60           # NASA/JPL "one page"; McConnell: defects rise well above this
  max_cognitive: 15       # SonarSource default
  max_cyclomatic: 10      # McCabe's original recommendation
  max_nesting: 4          # Kernighan & Plauger, McConnell
  max_params: 5           # pylint default; McConnell's hard limit is 7
  max_file_lines: 400
